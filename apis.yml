aid: containo
name: Containous (Traefik Labs)
description: >-
  Containous SAS is the France-founded (2016) cloud-native networking company that created Traefik, the
  open-source reverse proxy, ingress controller, and load balancer written in Go and downloaded billions of
  times from Docker Hub. Containous was surfaced through the API Evangelist network as a portfolio company of
  Balderton Capital, which led its Series A alongside Elaia Partners, 360 Capital, Kima Ventures, and OSS
  Capital. The company subsequently rebranded to Traefik Labs and its original containo.us domain now redirects
  to traefik.io. Under the Traefik Labs name it ships the open-source Traefik Proxy plus the commercial Traefik
  Hub product line (API Gateway, API Management, AI Gateway, and MCP Gateway). This repo is the company/parent
  profile; the full product and API surface (OpenAPI, CRDs, examples) lives in the api-evangelist/traefik repo.
